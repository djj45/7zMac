name: 7zMac
options:
  bundleIdPrefix: local.djj45
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEAD_CODE_STRIPPING: YES

targets:
  SevenZipMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
      # 从 7-Zip 源码编译出来的 7zz，拷进 Contents/MacOS 并随 App 签名
      - path: vendor/bin/7zz
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
    settings:
      base:
        PRODUCT_NAME: 7zMac
        PRODUCT_MODULE_NAME: SevenZipMac
        PRODUCT_BUNDLE_IDENTIFIER: local.djj45.7zmac
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/7zMac.entitlements
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: SevenZipFinder
        embed: true
        codeSign: true
    scheme: {}

  SevenZipFinder:
    type: app-extension
    platform: macOS
    sources:
      - path: FinderExt
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: SevenZipFinder
        PRODUCT_MODULE_NAME: SevenZipFinder
        PRODUCT_BUNDLE_IDENTIFIER: local.djj45.7zmac.finder
        INFOPLIST_FILE: FinderExt/Info.plist
        CODE_SIGN_ENTITLEMENTS: FinderExt/FinderExt.entitlements
        ENABLE_APP_SANDBOX: YES
